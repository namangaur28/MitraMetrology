databases:
  # PostgreSQL Database (Managed)
  - name: mitrametrology-db
    databaseName: mitrametrology_db
    user: mitrauser
    plan: free
    region: singapore

services:
  # Backend API (FastAPI)
  - type: web
    name: mitrametrology-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitrametrology-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: False
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: ALLOWED_IMAGE_EXTENSIONS
        value: jpg,jpeg,png
      - key: IMG_MAX_WIDTH
        value: 1920
      - key: IMG_MAX_HEIGHT
        value: 1080
      - key: IMG_QUALITY
        value: 85
      - key: OCR_LANGUAGE
        value: en
    healthCheckPath: /api/health

  # Frontend (React Static Site)
  - type: web
    name: mitrametrology-frontend
    env: node
    plan: free
    region: singapore
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://mitrametrology-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
